<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unix Stars</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0b0d17;--bg2:#141830;--card:rgba(255,255,255,.06);--tx:#eef0ff;--mu:#8e94b8;--ac:#7c5cff;--ac2:#22d3ee;--ok:#34d399;--er:#f43f5e;--bd:rgba(255,255,255,.1);--gold:#fbbf24}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef0fb;--bg2:#fff;--card:rgba(255,255,255,.85);--tx:#171a2e;--mu:#667090;--bd:rgba(20,24,60,.12)}}
:root[data-theme="dark"]{--bg:#0b0d17;--bg2:#141830;--card:rgba(255,255,255,.06);--tx:#eef0ff;--mu:#8e94b8;--bd:rgba(255,255,255,.1)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:15px/1.4 system-ui,sans-serif;background:radial-gradient(900px 500px at 0% -10%,rgba(124,92,255,.28),transparent),radial-gradient(700px 400px at 100% 0,rgba(34,211,238,.18),transparent),var(--bg);background-attachment:fixed}
.w{max-width:640px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0;backdrop-filter:blur(10px)}
button{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:12px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;transition:transform .12s,filter .2s}
button:active{transform:scale(.95)}button:hover{filter:brightness(1.1)}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd);font-weight:500}
button.r{background:linear-gradient(135deg,#f43f5e,#fb923c)}
input{background:rgba(127,127,160,.12);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px;font:inherit;width:100%;margin:4px 0;outline:none}
input:focus{border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.nav button{flex:none}
.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.er{color:var(--er)}
.view{animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;gap:8px;align-items:center}.top b{flex:1}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:6px 12px;font-weight:700;color:var(--gold)}
.it{display:flex;gap:6px;align-items:center}.it input{margin:2px 0}
.sm{flex:none;width:70px}
.case{display:flex;gap:12px;align-items:center}
.bx{font-size:42px;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-5px) rotate(-4deg)}}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:12px;border:1px solid var(--tc);color:var(--tc);border-radius:99px;padding:2px 8px}
.t0{--tc:#8e94b8}.t1{--tc:#60a5fa}.t2{--tc:#a78bfa}.t3{--tc:#fbbf24}
.ov{position:fixed;inset:0;z-index:9;background:rgba(5,6,15,.94);display:flex;flex-direction:column;justify-content:center;gap:16px;padding:16px;animation:fade .25s}
.rl{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--bd);background:#141830;height:132px}
.rl:before,.rl:after{content:"";position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none}
.rl:before{left:0;background:linear-gradient(90deg,#141830,transparent)}.rl:after{right:0;background:linear-gradient(270deg,#141830,transparent)}
.mk{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--gold);z-index:3;box-shadow:0 0 12px var(--gold)}
.tr{display:flex;gap:8px;padding:8px 0;will-change:transform}
.cell{flex:none;width:96px;height:116px;border-radius:12px;border:2px solid var(--tc);color:#eef0ff;background:linear-gradient(180deg,rgba(255,255,255,.07),transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;font-size:12px}
.cell .ic{font-size:30px}
.res{text-align:center;color:#eef0ff;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.res h2{margin:4px 0;color:var(--tc);text-shadow:0 0 18px var(--tc)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.sky{position:relative;height:260px;border-radius:18px;overflow:hidden;border:1px solid var(--bd);background:linear-gradient(180deg,#050816,#1b2a6b);color:#fff}
.stars{position:absolute;inset:0;opacity:.85;background-size:320px 240px;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 120px,#fff,transparent),radial-gradient(2px 2px at 160px 70px,#bcd,transparent),radial-gradient(1.5px 1.5px at 230px 190px,#fff,transparent),radial-gradient(2px 2px at 300px 100px,#fff,transparent)}
.fly .stars{animation:st .6s linear infinite}
@keyframes st{to{background-position:0 240px}}
.rk{position:absolute;left:14px;bottom:12px;font-size:46px;transition:transform .06s linear;filter:drop-shadow(0 6px 10px rgba(255,140,0,.6))}
.fly .rk{animation:wob .25s ease-in-out infinite alternate}
@keyframes wob{to{margin:-2px 0 0 2px}}
.mx{position:absolute;top:18px;left:0;right:0;text-align:center;font-size:48px;font-weight:800;text-shadow:0 0 20px rgba(124,92,255,.8)}
.mx.mid{color:var(--ac2)}.mx.hi{color:var(--gold);text-shadow:0 0 24px var(--gold)}
.boom{animation:shake .4s}.boom .rk{animation:bm .7s ease-out forwards}.boom .mx{color:var(--er)}
@keyframes bm{from{scale:.4}60%{scale:2.4}to{scale:1.8}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.win{box-shadow:0 0 0 2px var(--ok),0 0 30px rgba(52,211,153,.5)}.win .mx{color:var(--ok)}
</style></head><body><div class="w" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=null,tk=null,tab='cases',msg='',A=null,EC=[],rt=null,rp=null,lg=null,pl=null;
try{tk=localStorage.getItem('tk')}catch(e){}
async function api(p,b){
 const r=await fetch('/api/'+p,{method:b===undefined?'GET':'POST',headers:{'content-type':'application/json',...(tk?{authorization:'Bearer '+tk}:{})},body:b===undefined?undefined:JSON.stringify(b)});
 const d=await r.json().catch(()=>({error:'Ошибка сети'}));
 if(!r.ok){if(r.status==401){tk=null;S=null}throw new Error(d.error||'Ошибка')}
 return d}
const er=e=>'<span class="er">'+esc(e.message)+'</span>';
async function load(){try{S=await api('state')}catch(e){S=null}render()}
async function loadAdmin(){try{A=await api('admin/data');EC=JSON.parse(JSON.stringify(S.cases))}catch(e){A=null}render()}
async function act(p,b,ok){try{const d=await api(p,b);msg=ok?ok(d):''}catch(e){msg=er(e)}await load();if(S&&S.adm&&tab=='adm')await loadAdmin()}
const sm=c=>c.items.reduce((a,b)=>a+b.w,0)||1;
const pc=(c,i)=>+(i.w/sm(c)*100).toFixed(2);
function go(t){tab=t;msg='';if(t=='adm'&&S.adm)loadAdmin();else{render();if(t=='rock')rkInit()}}
function render(){
 const a=$('app');
 if(!S){a.innerHTML=loginView();return}
 const T=(k,n)=>`<button class="${tab==k?'':'g'}" onclick="go('${k}')">${n}</button>`;
 a.innerHTML=`<div class="card top"><b>@${esc(S.user)}</b><span class="chip" id="bal">⭐ ${S.bal}</span><button class="g" onclick="logout()">Выйти</button></div>
 <div class="nav">${T('cases','Кейсы')}${T('rock','Rockets')}${T('inv','Инвентарь')}${T('dep','Баланс')}${S.canAdm?T('adm','Админ'):''}</div>
 <div class="mu" id="m">${msg}</div><div class="view">`+({cases:casesView,rock:rockView,inv:invView,dep:depView,adm:admView}[tab])()+`</div>`;
}
function loginView(){return lg?`<div class="card"><h3>Код из бота</h3><p class="mu">Бот отправил код пользователю @${esc(lg.u)}. Если не пришёл, откройте бота @${esc(lg.bot)} и нажмите Start.</p><input id="cd" placeholder="Код" inputmode="numeric"><button onclick="verify()">Войти</button> <button class="g" onclick="lg=null;msg='';render()">Назад</button><div>${msg}</div></div>`:`<div class="card"><div class="bx" style="font-size:54px;text-align:center">🚀</div><h2 style="text-align:center">Unix Stars</h2><p class="mu">Вход по юзернейму из Unixgram.</p><input id="un" placeholder="@username"><button onclick="login()">Войти</button><div>${msg}</div></div>`}
async function login(){try{const u=$('un').value,d=await api('login',{username:u});if(d.token){tk=d.token;try{localStorage.setItem('tk',tk)}catch(e){}msg='';await load();return}lg={u:u.replace(/^@/,''),bot:d.bot};msg=''}catch(e){msg=er(e)}render()}
async function verify(){try{const d=await api('login/verify',{username:lg.u,code:$('cd').value});tk=d.token;try{localStorage.setItem('tk',tk)}catch(e){}lg=null;msg='';await load()}catch(e){msg=er(e);render()}}
async function logout(){try{await api('logout',{})}catch(e){}tk=null;S=null;A=null;try{localStorage.removeItem('tk')}catch(e){}render()}
// Кейсы
const tier=v=>v<=0?0:v<30?1:v<150?2:3,IC=['💨','🪙','💎','👑'];
function casesView(){return S.cases.map(c=>`<div class="card"><div class="case"><div class="bx">📦</div><div style="flex:1"><b>${esc(c.name)}</b><div class="mu">⭐ ${c.price}</div></div><button onclick="openCase(${c.id})">Открыть</button></div><div class="tags">${c.items.map(i=>`<span class="tag t${tier(i.value)}">${esc(i.name)} ${pc(c,i)}%</span>`).join('')}</div></div>`).join('')}
let busy=0;
const pick=c=>{let r=Math.random()*sm(c);for(const i of c.items){if((r-=i.w)<0)return i}return c.items[0]};
async function openCase(id){if(busy)return;busy=1;try{const d=await api('case/open',{id}),c=S.cases.find(x=>x.id==id);roll(c,d.item)}catch(e){msg=er(e);busy=0;render()}}
const cellH=i=>{const t=tier(i.value);return `<div class="cell t${t}"><div class="ic">${IC[t]}</div><b>${esc(i.name)}</b><span>${i.value} ⭐</span></div>`};
function roll(c,win){const W=34,cells=[];for(let k=0;k<44;k++)cells.push(k==W?win:pick(c));
 const o=document.createElement('div');o.className='ov';o.id='ov';
 o.innerHTML=`<div class="mu" style="text-align:center">${esc(c.name)}</div><div class="rl"><div class="mk"></div><div class="tr" id="tr">${cells.map(cellH).join('')}</div></div><div id="rv" style="min-height:130px"></div>`;
 document.body.appendChild(o);
 const tr=$('tr'),vw=o.querySelector('.rl').clientWidth,x=W*104+48-vw/2+(Math.random()-.5)*60;
 tr.style.transition='none';tr.style.transform='translateX(0)';tr.getBoundingClientRect();
 tr.style.transition='transform 5s cubic-bezier(.1,.75,.15,1)';tr.style.transform=`translateX(${-x}px)`;
 setTimeout(()=>{const t=tier(win.value);$('rv').innerHTML=`<div class="res t${t}"><div style="font-size:54px">${IC[t]}</div><h2>${win.value>0?esc(win.name):'Пусто'}</h2><div class="mu">${win.value>0?win.value+' ⭐ — в инвентаре':'В этот раз не повезло'}</div><button style="margin-top:10px" onclick="closeOv()">Закрыть</button></div>`;try{navigator.vibrate&&navigator.vibrate(win.value>0?[40,40,80]:30)}catch(e){}},5200)}
async function closeOv(){const o=$('ov');if(o)o.remove();busy=0;await load()}
// Инвентарь
function invView(){return (S.inv.length?S.inv.map(i=>`<div class="card case t${tier(i.value)}"><div class="bx" style="animation:none">${IC[tier(i.value)]}</div><div style="flex:1"><b>${esc(i.name)}</b><div class="mu">${i.value} ⭐</div></div><div style="display:flex;flex-direction:column;gap:6px"><button onclick="sell(${i.id})">Продать ${Math.floor(i.value*(100-S.cfg.sell_fee)/100)}</button><button class="g" onclick="act('inv/withdraw',{id:${i.id}},()=>'Заявка на вывод предмета отправлена')">Вывести</button></div></div>`).join(''):'<div class="card mu">Инвентарь пуст</div>')+`<div class="mu">Комиссия продажи: ${S.cfg.sell_fee}%</div>`+myReqs()}
function sell(id){act('inv/sell',{id},d=>`Продано за ${d.get} ⭐`)}
// Баланс
function depCard(){return S.cfg.botOn?`<div class="card"><h3>Пополнение</h3><p class="mu">Укажите сумму: бот @${esc(S.cfg.bot)} пришлёт вам счёт в Unixgram. Оплатите его, и баланс пополнится автоматически.</p><input id="da" type="number" placeholder="Сумма ⭐"><button onclick="dep()">Получить счёт</button><div class="mu">Комиссия пополнения: ${S.cfg.dep_fee}%</div></div>`:`<div class="card"><h3>Пополнение</h3><p class="mu">1. Отправьте звёзды в Unixgram на аккаунт <b>@${esc(S.cfg.recv)}</b>.<br>2. Укажите свой юзернейм из Unixgram и сумму. Админ проверит перевод и подтвердит заявку.</p><input id="du" placeholder="Ваш @username в Unixgram"><input id="da" type="number" placeholder="Сумма ⭐"><button onclick="dep()">Отправить заявку</button><div class="mu">Комиссия пополнения: ${S.cfg.dep_fee}%</div></div>`}
function depView(){return depCard()+`
<div class="card"><h3>Вывод звёзд</h3><input id="wa" type="number" placeholder="Сумма ⭐"><button onclick="act('withdraw',{amount:$('wa').value},()=>'Заявка на вывод отправлена')">Подать заявку</button></div>${myReqs()}`}
async function dep(){try{await api('deposit',{amount:Math.floor(+$('da').value),from:$('du')?$('du').value:''});if(S.cfg.botOn){msg='Счёт отправлен в чат с ботом @'+esc(S.cfg.bot)+'. Оплатите его, баланс обновится сам.';render();pollBal()}else{msg='Заявка на пополнение отправлена, ждите подтверждения';await load()}}catch(e){msg=er(e);render()}}
function pollBal(){clearInterval(pl);let n=0;const b0=S.bal;pl=setInterval(async()=>{try{S=await api('state');updBal();if(S.bal>b0){clearInterval(pl);msg='<b class="ok">Баланс пополнен</b>';render()}}catch(e){}if(++n>36)clearInterval(pl)},5000)}
const stl={new:'⏳ ожидает',done:'✅ выполнено',no:'❌ отклонено'};
const rd=r=>r.type=='stars'?`Вывод звёзд: ${r.amount} ⭐`:r.type=='dep'?`Пополнение: @${esc(r.from_user)} перевёл ${r.amount} ⭐ → зачислить ${Math.floor(r.amount*(100-S.cfg.dep_fee)/100)} ⭐`:`Вывод предмета: ${esc(r.item_name)} (${r.item_value} ⭐)`;
function myReqs(){return S.reqs.length?`<div class="card"><b>Мои заявки</b>${S.reqs.map(r=>`<div class="mu">${rd(r)} — ${stl[r.status]}</div>`).join('')}</div>`:''}
// Rockets (всё считает сервер, клиент только рисует)
function rockView(){return `<div class="card"><div class="sky" id="sky"><div class="stars"></div><div class="rk" id="rk">🚀</div><div class="mx" id="mx">1.00x</div></div><input id="bt" type="number" min="1" placeholder="Ставка ⭐" value="10" style="margin-top:12px"><div class="row"><button onclick="rkStart()">Старт</button><button class="r" onclick="rkOut()">Забрать</button></div><div class="mu" id="rs"></div></div>`}
function updBal(){const e=$('bal');if(e)e.textContent='⭐ '+S.bal}
function rkStop(){clearInterval(rt);clearInterval(rp);rt=rp=null}
function rkDraw(m){const s=$('sky'),r=$('rk'),x=$('mx');if(!s||!r||!x)return;const p=Math.min(1,Math.log(m)/Math.log(10)),W=s.clientWidth-80,H=s.clientHeight-130;r.style.transform=`translate(${p*W*.85}px,${-p*H}px)`;x.textContent=m.toFixed(2)+'x';x.className='mx'+(m>=5?' hi':m>=2?' mid':'')}
function rkRun(m0){rkStop();const t=Date.now(),s=$('sky'),r=$('rk');if(s)s.className='sky fly';if(r)r.textContent='🚀';
 rt=setInterval(()=>{if(!$('sky')){rkStop();return}rkDraw(m0*Math.exp(0.00012*(Date.now()-t)))},50);
 rp=setInterval(async()=>{try{const d=await api('rocket/status');if(!$('sky')){rkStop();return}if(d.crashed)rkCrash(d.crash);else if(d.none)rkStop()}catch(e){}},500)}
function rkCrash(c){rkStop();const s=$('sky');if(s){s.className='sky boom';$('rk').textContent='💥';const x=$('mx');x.textContent=c.toFixed(2)+'x';x.className='mx'}const r=$('rs');if(r)r.textContent='Ракета взорвалась, ставка потеряна';try{navigator.vibrate&&navigator.vibrate([80,40,80])}catch(e){}}
async function rkInit(){try{const d=await api('rocket/status');if(d.run)rkRun(d.m)}catch(e){}}
async function rkStart(){try{const bet=Math.floor(+$('bt').value);const d=await api('rocket/start',{bet});S.bal-=d.bet;updBal();$('rs').textContent='';rkDraw(1);rkRun(1)}catch(e){$('rs').innerHTML=er(e)}}
async function rkOut(){try{const d=await api('rocket/cashout',{});if(d.crashed){rkCrash(d.crash);return}rkStop();S.bal+=d.win;updBal();$('sky').className='sky win';$('mx').textContent=d.m.toFixed(2)+'x';$('rs').textContent='Выигрыш: '+d.win+' ⭐'}catch(e){$('rs').innerHTML=er(e)}}
// Админка
function setPct(ci,ii,v){const it=EC[ci].items,s=sm(EC[ci]),P=it.map(x=>x.w/s*100);v=it.length==1?100:Math.min(100,Math.max(0,v||0));const so=P.reduce((a,b,k)=>k==ii?a:a+b,0);
 it.forEach((x,k)=>{x.w=k==ii?v:+(so>0?P[k]*(100-v)/so:(100-v)/(it.length-1)).toFixed(2)});render()}
function addItem(ci){const it=EC[ci].items;it.push({name:'Приз',value:10,w:10});const s=sm(EC[ci]);it.forEach(x=>x.w=+(x.w/s*100).toFixed(2));render()}
function delItem(ci,ii){const it=EC[ci].items;it.splice(ii,1);if(it.length){const s=sm(EC[ci]);it.forEach(x=>x.w=+(x.w/s*100).toFixed(2))}render()}
function saveCase(ci){const c=EC[ci];act('admin/case',{id:c.id,name:c.name,price:c.price,items:c.items},()=>'Кейс сохранён')}
function delCase(ci){if(EC[ci].id)act('admin/case/delete',{id:EC[ci].id},()=>'Кейс удалён');else{EC.splice(ci,1);render()}}
function saveCfg(){act('admin/settings',{dep_fee:$('f1').value,sell_fee:$('f2').value,rtp:$('f3').value,r1:$('f6').value,rmax:$('f7').value,bot:$('f4').value,recv:$('f5').value},()=>'Настройки сохранены')}
function admView(){
 if(!S.adm)return `<div class="card"><input id="ap" type="password" placeholder="Пароль админки"><button onclick="admLogin()">Войти</button></div>`;
 if(!A)return '<div class="mu">Загрузка…</div>';
 let h=EC.map((c,ci)=>`<div class="card"><div class="it"><input value="${esc(c.name)}" onchange="EC[${ci}].name=this.value"><input class="sm" type="number" value="${c.price}" onchange="EC[${ci}].price=+this.value"></div>
 <div class="mu">Название · приз ⭐ · шанс % (остальные подстраиваются, сумма 100%)</div>
 ${c.items.map((i,ii)=>`<div class="it"><input value="${esc(i.name)}" onchange="EC[${ci}].items[${ii}].name=this.value"><input class="sm" type="number" value="${i.value}" onchange="EC[${ci}].items[${ii}].value=+this.value"><input class="sm" type="number" step="0.01" value="${pc(c,i)}" onchange="setPct(${ci},${ii},+this.value)"><button class="g sm" onclick="delItem(${ci},${ii})">✕</button></div>`).join('')}
 <div class="row"><button class="g" onclick="addItem(${ci})">+ приз</button><button onclick="saveCase(${ci})">Сохранить</button><button class="r" onclick="delCase(${ci})">Удалить</button></div></div>`).join('');
 h+=`<button onclick="EC.push({id:0,name:'Новый кейс',price:10,items:[{name:'Приз',value:10,w:100}]});render()">+ Новый кейс</button>`;
 const c=A.cfg;
 h+=`<div class="card"><b>Настройки</b><div class="mu">Комиссия пополнения %</div><input id="f1" type="number" value="${c.dep_fee}"><div class="mu">Комиссия продажи % (идёт на баланс @gold)</div><input id="f2" type="number" value="${c.sell_fee}"><div class="mu">Rockets: возврат игрокам % (RTP, 50–100)</div><input id="f3" type="number" value="${c.rtp}"><div class="mu">Rockets: шанс мгновенного краша на 1.00x, % (0–90)</div><input id="f6" type="number" value="${c.r1}"><div class="mu">Rockets: максимальный множитель (2–10000)</div><input id="f7" type="number" value="${c.rmax}"><div class="mu">Юз бота</div><input id="f4" value="${esc(c.bot)}"><div class="mu">Аккаунт для пополнения (режим без бота)</div><input id="f5" value="${esc(c.recv)}"><button onclick="saveCfg()">Сохранить</button></div>`;
 h+=`<div class="card"><b>Заявки (${A.reqs.length})</b>${A.reqs.map(r=>`<div class="it"><span style="flex:1">@${esc(r.user)}: ${rd2(r)}</span><button class="sm" onclick="reqAct(${r.id},1)">✓</button><button class="r sm" onclick="reqAct(${r.id},0)">✕</button></div>`).join('')||'<div class="mu">Нет новых</div>'}</div>`;
 if(S.owner)h+=`<div class="card"><b>Токен бота Unixgram</b><input id="bt2" type="password" placeholder="Токен бота"><button onclick="act('admin/bot',{token:$('bt2').value},()=>'Бот подключён, вебхук установлен')">Подключить</button></div><div class="card"><b>Админы (только владелец)</b>${A.admins.map(n=>`<div class="it"><span style="flex:1">@${esc(n)}</span><button class="r sm" onclick="act('admin/admins',{name:'${esc(n)}',remove:1})">✕</button></div>`).join('')}<div class="it"><input id="na" placeholder="@username"><button class="sm" onclick="act('admin/admins',{name:$('na').value})">+</button></div><input id="np" type="password" placeholder="Новый пароль (от 8 символов)"><button class="g" onclick="act('admin/password',{password:$('np').value},()=>'Пароль изменён')">Сменить пароль</button></div>`;
 return h}
const rd2=r=>rd({...r});
function reqAct(id,ok){act('admin/req',{id,ok},()=>ok?'Заявка подтверждена':'Заявка отклонена')}
async function admLogin(){try{await api('admin/login',{password:$('ap').value});msg='';await load();await loadAdmin()}catch(e){msg=er(e);render()}}
if(tk)load();else render();
</script></body></html>
