<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Unix Stars</title>
<style>
:root{--bg:#0b0e14;--card:#121823;--card2:#171e2b;--tx:#f2f5fb;--mu:#8a94a8;--ac:#2f8cff;--ok:#34d399;--er:#f43f5e;--bd:#1d2535;--gold:#fbbf24;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--tx);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:560px;margin:0 auto;padding:0 14px calc(96px + env(safe-area-inset-bottom,0px))}
.hdr{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:10px;margin:0 -14px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:rgba(11,14,20,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--ac),#7db4ff);display:grid;place-items:center;font-size:19px;flex:none}
.brand{font-weight:800;font-size:20px;letter-spacing:-.3px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:8px 14px;font-weight:700;white-space:nowrap}
h1{font-size:30px;margin:20px 0 4px;letter-spacing:-.6px;line-height:1.1}
h2,h3{margin:0 0 8px}
.sub{color:var(--mu);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0}
button{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;transition:transform .12s,filter .2s,opacity .2s}
button:active{transform:scale(.96)}button:hover{filter:brightness(1.1)}button:disabled{opacity:.45;cursor:default;filter:none;transform:none}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd);font-weight:600}
button.r{background:var(--er)}
.big{width:100%;border-radius:99px;padding:18px;font-size:19px;box-shadow:0 12px 34px rgba(47,140,255,.35)}
input{background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:11px;font:inherit;width:100%;margin:4px 0;outline:none}
input:focus{border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok)}.er{color:var(--er)}
.view{animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin:14px 0}
.seg button{flex:1;background:none;color:var(--mu);padding:9px 6px;border-radius:10px;font-weight:600}
.seg button.on{background:var(--ac);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;height:calc(72px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(11,14,20,.94);backdrop-filter:blur(14px);border-top:1px solid var(--bd)}
.bar button{background:none;color:var(--mu);flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;padding:6px 4px;border-radius:12px}
.bar button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bar button.on{color:#fff}.bar button.on svg{stroke:var(--ac)}
/* рекламный баннер над нижним меню */
#adbox{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:5;display:none;padding:0 12px 8px;pointer-events:none}
#adbox.on{display:block}
.ad{pointer-events:auto;display:block;position:relative;max-width:536px;height:72px;margin:0 auto;border-radius:14px;overflow:hidden;border:1px solid var(--bd);background:var(--card);box-shadow:0 6px 20px rgba(0,0,0,.45);color:inherit}
.ad img,.ad video{width:100%;height:100%;object-fit:cover;display:block}
.adl{position:absolute;top:4px;right:6px;font-size:10px;line-height:14px;color:#fff;background:rgba(0,0,0,.55);border-radius:6px;padding:0 6px}
.hasad .w{padding-bottom:calc(172px + env(safe-area-inset-bottom,0px))}
.adp .ad{box-shadow:none;margin:0}
/* картинки */
.ph{width:56px;height:56px;border-radius:14px;background:var(--card2);display:grid;place-items:center;overflow:hidden;font-size:28px;flex:none}
.ph img{width:100%;height:100%;object-fit:contain}
/* кейсы */
.case{display:flex;gap:12px;align-items:center}
.cimg{width:84px;height:84px;border-radius:18px;background:radial-gradient(circle at 50% 30%,#1b2a44,var(--card2));display:grid;place-items:center;overflow:hidden;font-size:42px;flex:none}
.cimg img{width:100%;height:100%;object-fit:contain}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tag{font-size:12px;border:1px solid var(--tc);color:var(--tc);border-radius:99px;padding:2px 8px}
.t0{--tc:#8a94a8}.t1{--tc:#60a5fa}.t2{--tc:#a78bfa}.t3{--tc:#fbbf24}
.ov{position:fixed;inset:0;z-index:9;background:rgba(5,7,12,.95);display:flex;flex-direction:column;justify-content:center;gap:16px;padding:16px;animation:fade .25s}
.rl{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--bd);background:var(--card);height:132px}
.rl:before,.rl:after{content:"";position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none}
.rl:before{left:0;background:linear-gradient(90deg,var(--card),transparent)}.rl:after{right:0;background:linear-gradient(270deg,var(--card),transparent)}
.mk{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--ac);z-index:3;box-shadow:0 0 12px var(--ac)}
.tr{display:flex;gap:8px;padding:8px 0;will-change:transform}
.cell{flex:none;width:96px;height:116px;border-radius:12px;border:2px solid var(--tc);background:linear-gradient(180deg,rgba(255,255,255,.06),transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;font-size:12px;padding:4px}
.cell .ic{font-size:30px;height:44px;display:grid;place-items:center}.cell .ic img{width:44px;height:44px;object-fit:contain}
.cell b{max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res{text-align:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.res h2{margin:4px 0;color:var(--tc);text-shadow:0 0 18px var(--tc)}
.res .big-ic{width:110px;height:110px;margin:0 auto;display:grid;place-items:center;font-size:70px}.res .big-ic img{width:100%;height:100%;object-fit:contain}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
/* колесо */
.wheel{position:relative;width:100%;max-width:400px;aspect-ratio:1;margin:18px auto 22px}
.wheel #wh{position:absolute;inset:0;will-change:transform}
.wptr{position:absolute;top:-8px;left:50%;margin-left:-14px;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--ac);z-index:3;filter:drop-shadow(0 4px 8px rgba(47,140,255,.6))}
.hub{position:absolute;left:50%;top:50%;width:17%;aspect-ratio:1;margin:-8.5% 0 0 -8.5%;border-radius:50%;background:var(--card);border:2px solid var(--bd);display:grid;place-items:center;font-weight:800;font-size:clamp(11px,3.2vw,17px);letter-spacing:.5px;z-index:2}
/* профиль */
.prof{display:flex;gap:14px;align-items:center}
.ava{overflow:hidden;width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#8b5cf6);display:grid;place-items:center;font-size:30px;font-weight:800;flex:none}
.badge{display:inline-block;font-size:11px;font-weight:700;color:var(--ac);border:1px solid var(--ac);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:var(--mu)}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inv{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.inv .ph{width:84px;height:84px;font-size:42px}
.inv button{width:100%;padding:9px 6px;font-size:13px}
/* рейтинг и бейджи */
.bdgs{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.bdg{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--bc);border:1px solid var(--bc);background:color-mix(in srgb,var(--bc) 14%,transparent);border-radius:99px;padding:2px 9px 2px 6px;white-space:nowrap}
.bdg img{width:16px;height:16px;object-fit:contain}
.rrow{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 12px;margin:8px 0;cursor:pointer}
.rrow:active{transform:scale(.985)}
.pl{width:30px;text-align:center;font-weight:800;font-size:18px;color:var(--mu);flex:none}
.ava img{width:100%;height:100%;object-fit:cover}
.ava.s{width:42px;height:42px;font-size:19px}
.rn{flex:1;min-width:0}.rn .bdgs{margin:4px 0 0}
.rv{text-align:right;flex:none}.rv b{display:block;font-size:17px}.rv span{font-size:12px;color:var(--mu)}
select{background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:11px;font:inherit;width:100%;margin:4px 0;outline:none}
input.clr{width:48px;flex:none;padding:2px;height:42px}
/* игры */
.sky{position:relative;height:260px;border-radius:18px;overflow:hidden;border:1px solid var(--bd);background:linear-gradient(180deg,#050816,#14246b);color:#fff}
.stars{position:absolute;inset:0;opacity:.85;background-size:320px 240px;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 90px 120px,#fff,transparent),radial-gradient(2px 2px at 160px 70px,#bcd,transparent),radial-gradient(1.5px 1.5px at 230px 190px,#fff,transparent),radial-gradient(2px 2px at 300px 100px,#fff,transparent)}
.fly .stars{animation:st .6s linear infinite}
@keyframes st{to{background-position:0 240px}}
.rk{position:absolute;left:14px;bottom:12px;font-size:46px;transition:transform .06s linear;filter:drop-shadow(0 6px 10px rgba(255,140,0,.6))}
.fly .rk{animation:wob .25s ease-in-out infinite alternate}
@keyframes wob{to{margin:-2px 0 0 2px}}
.mx{position:absolute;top:18px;left:0;right:0;text-align:center;font-size:48px;font-weight:800;text-shadow:0 0 20px rgba(47,140,255,.8)}
.mx.mid{color:#7db4ff}.mx.hi{color:var(--gold);text-shadow:0 0 24px var(--gold)}
.boom{animation:shake .4s}.boom .rk{animation:bm .7s ease-out forwards}.boom .mx{color:var(--er)}
@keyframes bm{from{scale:.4}60%{scale:2.4}to{scale:1.8}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.win{box-shadow:0 0 0 2px var(--ok),0 0 30px rgba(52,211,153,.5)}.win .mx{color:var(--ok)}
.mgrid{display:grid;gap:6px;margin:10px 0}
.mc{aspect-ratio:1;padding:0;font-size:24px;background:var(--card2);border:1px solid var(--bd);color:var(--tx);border-radius:12px}
.mc:disabled{cursor:default;filter:none;opacity:1}
.mc.ok{background:linear-gradient(135deg,#10b981,#0ea5e9);animation:pop .3s}
.mc.hit{background:linear-gradient(135deg,#f43f5e,#fb923c);animation:pop .4s}
.mc.dim{opacity:.55}
.mgh{display:flex;justify-content:space-between;align-items:center}
/* админка */
.it{display:flex;gap:6px;align-items:center}.it input{margin:2px 0}
.sm{flex:none;width:68px}
.th{flex:none;width:42px;height:42px;padding:0;border-radius:12px;background:var(--card2);border:1px dashed var(--bd);overflow:hidden;font-size:18px;display:grid;place-items:center}
.th img{width:100%;height:100%;object-fit:contain}
.sum{font-size:13px;margin:4px 0}
</style></head><body><div class="w" id="app"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=null,tk=null,tab='cases',psub='inv',msg='',A=null,EC=[],EW={items:[]},EB=[],RT=null,RBY='opens',VU=null,BGU='',BGB=0,AD=null,PQ='',PR=null,PU=null,PA='',PRS='',ALG=null,rt=null,rp=null,lg=null,pl=null;
try{tk=localStorage.getItem('tk')}catch(e){}
async function api(p,b){
 const r=await fetch('/api/'+p,{method:b===undefined?'GET':'POST',headers:{'content-type':'application/json',...(tk?{authorization:'Bearer '+tk}:{})},body:b===undefined?undefined:JSON.stringify(b)});
 const d=await r.json().catch(()=>({error:'Ошибка сети'}));
 if(!r.ok){if(r.status==401){tk=null;S=null}throw new Error(d.error||'Ошибка')}
 return d}
const er=e=>'<span class="er">'+esc(e.message)+'</span>';
const imgTag=(id,fb)=>id?`<img src="/api/img/${esc(id)}" alt="" loading="lazy">`:`<span>${fb}</span>`;
async function load(){try{S=await api('state');woff=S.wheel?S.wheel.now-Date.now():0}catch(e){S=null}render()}
async function loadAdmin(){try{A=await api('admin/data');AD=null;EC=JSON.parse(JSON.stringify(S.cases));EW={items:JSON.parse(JSON.stringify(S.wheel.prizes))};EB=JSON.parse(JSON.stringify(A.badges||[]));try{PR=await api('admin/users',{q:PQ})}catch(e){}if(PU)try{PU=await api('admin/user',{name:PU.name})}catch(e){PU=null};if(!EB.some(b=>b.id==BGB))BGB=EB[0]?EB[0].id:0}catch(e){A=null}render()}
async function act(p,b,ok){try{const d=await api(p,b);msg=ok?ok(d):''}catch(e){msg=er(e)}await load();if(S&&S.adm&&tab=='adm')await loadAdmin()}
const sm=c=>c.items.reduce((a,b)=>a+b.w,0)||1;
const pc=(c,i)=>+(i.w/sm(c)*100).toFixed(2);
function go(t){tab=t;msg='';if(t=='adm'&&S.adm)loadAdmin();else{render();if(t=='rock')rkInit();if(t=='mines')mgInit();if(t=='rate')loadRating()}}
const ICN={
 box:'<svg viewBox="0 0 24 24"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>',
 wheel:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.4"/><path d="M12 3v6.6M12 14.4V21M3 12h6.6M14.4 12H21"/></svg>',
 trophy:'<svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5v1.500A3 3 0 0 0 8 10.500M16 6h3v1.500a3 3 0 0 1-3 3M12 13v4M8.500 20h7M10 17h4"/></svg>',
 user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1-4 4-6 7.500-6s6.500 2 7.500 6"/></svg>',
 gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.500v3M12 18.500v3M2.500 12h3M18.500 12h3M5.300 5.300l2.100 2.100M16.600 16.600l2.100 2.100M5.300 18.700l2.100-2.100M16.600 7.400l2.100-2.100"/></svg>'};
const GAMES=['cases','rock','mines'];
function render(){
 syncAd();
 const a=$('app');
 if(!S){a.innerHTML=loginView();return}
 if(S.needPw){a.innerHTML=pwView();return}
 const B=(k,ic,n,on)=>`<button class="${on?'on':''}" onclick="go('${k}')">${ICN[ic]}<span>${n}</span></button>`;
 const seg=GAMES.includes(tab)?`<div class="seg">${[['cases','Кейсы'],['rock','Rockets'],['mines','Сапёр']].map(([k,n])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${n}</button>`).join('')}</div>`:'';
 a.innerHTML=`<div class="hdr"><div class="logo">⭐</div><div class="brand">${esc(S.cfg.site)}</div><span class="chip" id="bal">⭐ ${S.bal}</span></div>
 <div class="mu" id="m" style="margin-top:8px">${msg}</div><div class="view">${seg}`+({cases:casesView,rock:rockView,mines:minesView,wheel:wheelView,rate:rateView,user:userView,prof:profView,adm:admView}[tab])()+`</div><nav class="bar">${B('cases','box','Кейсы',GAMES.includes(tab))}${B('wheel','wheel','Колесо',tab=='wheel')}${B('rate','trophy','Рейтинг',tab=='rate'||tab=='user')}${B('prof','user','Профиль',tab=='prof')}${S.canAdm?B('adm','gear','Админ',tab=='adm'):''}</nav>`;
 if(tab=='wheel')updWheelBtn();
 document.querySelectorAll('.adp video').forEach(v=>{v.muted=true;v.play().catch(()=>{})});
}
function loginView(){
 const m=`<div>${msg}</div>`,bk=`<button class="g" onclick="lg=null;msg='';render()">Назад</button>`,hd=t=>`<div style="text-align:center;margin:40px 0 18px"><div class="logo" style="width:64px;height:64px;font-size:32px;margin:0 auto 12px;border-radius:20px">⭐</div><h2 style="font-size:26px">${t}</h2></div>`;
 if(!lg)return hd('Unix Stars')+`<div class="card"><p class="mu">Введите юзернейм из Unixgram.</p><input id="un" placeholder="@username" autocapitalize="none"><button style="width:100%;margin-top:6px" onclick="authStart()">Продолжить</button>${m}</div>`;
 if(lg.step=='owner')return `<div class="card"><h3>Вход владельца @${esc(lg.u)}</h3><p class="mu">Бот ещё не подключён, поэтому код прислать некому. Введите пароль администратора (секрет <b>ADMIN_PASSWORD</b> из Cloudflare), затем придумайте пароль аккаунта.</p><input id="op" type="password" placeholder="Пароль администратора"><button style="width:100%" onclick="authOwner()">Продолжить</button><div class="row" style="margin-top:8px">${bk}</div>${m}</div>`;
 if(lg.step=='password')return `<div class="card"><h3>@${esc(lg.u)}</h3><input id="pw" type="password" placeholder="Пароль"><button style="width:100%" onclick="authPw()">Войти</button><div class="row" style="margin-top:8px"><button class="g" onclick="authForgot()">Забыли пароль?</button>${bk}</div>${m}</div>`;
 return `<div class="card"><h3>Подтверждение @${esc(lg.u)}</h3><p class="mu">${lg.manual?'Код пришлёт администратор в Unixgram на этот юзернейм, обычно в течение нескольких минут. Введите его:':'Бот отправил код вам в Unixgram. Введите его:'}</p><input id="cd" placeholder="Код" inputmode="numeric"><button style="width:100%" onclick="verify()">Подтвердить</button><div class="row" style="margin-top:8px">${bk}</div>${m}</div>`}
function pwView(){return `<div class="card" style="margin-top:40px"><h3>Придумайте пароль</h3><p class="mu">Вы подтвердили @${esc(S.user)}. Пароль понадобится для следующих входов (от 8 символов).</p><input id="p1" type="password" placeholder="Пароль"><input id="p2" type="password" placeholder="Повторите пароль"><button style="width:100%" onclick="setPw()">Сохранить и войти</button><div>${msg}</div></div>`}
const saveTk=t=>{tk=t;try{localStorage.setItem('tk',t)}catch(e){}};
async function authStart(){const u=$('un').value.replace(/^@/,'').trim();try{const d=await api('auth/start',{username:u});lg={u,...d};msg=''}catch(e){msg=er(e)}render()}
async function authForgot(){try{const d=await api('auth/forgot',{username:lg.u});lg={u:lg.u,...d};msg=''}catch(e){msg=er(e)}render()}
async function authOwner(){try{const d=await api('auth/owner',{password:$('op').value});saveTk(d.token);lg=null;msg='';await load()}catch(e){msg=er(e);render()}}
async function authPw(){try{const d=await api('auth/password',{username:lg.u,password:$('pw').value});saveTk(d.token);lg=null;msg='';await load()}catch(e){msg=er(e);render()}}
async function verify(){try{const d=await api('login/verify',{username:lg.u,code:$('cd').value});saveTk(d.token);lg=null;msg='';await load()}catch(e){msg=er(e);render()}}
async function setPw(){const a=$('p1').value;if(a!==$('p2').value){msg=er(new Error('Пароли не совпадают'));return render()}try{const d=await api('account/password',{password:a});saveTk(d.token);msg='';await load()}catch(e){msg=er(e);render()}}
async function logout(){try{await api('logout',{})}catch(e){}tk=null;S=null;A=null;try{localStorage.removeItem('tk')}catch(e){}render()}
const off=()=>'<div class="card mu">Игра временно отключена</div>';
// Сапёр (все расчёты на сервере)
let mg=null;
function minesView(){if(!S.cfg.on.mines)return off();return `<div class="card"><div class="mgh"><span class="chip" id="mgm">x1.00</span><span class="mu">💎 множитель растёт с каждой клеткой</span></div><div class="mgrid" id="mgrid"></div><div class="mu" id="mgs"></div></div><div class="card" id="mgc"></div>`}

 for(let i=0;i<N*N;i++){const op=mg&&mg.opened.includes(i),bm=mg&&mg.pos&&mg.pos.includes(i);

async function mgInit(){if(!S.cfg.on.mines)return;try{const d=await api('mines/status');if(d.none){if(mg&&mg.run)mg=null}else mg={...d,run:1}}catch(e){}mgDraw()}

async function mgOpen(i){if(!mg||!mg.run||mg.busy)return;mg.busy=1;try{const d=await api('mines/open',{i});
 if(d.boom){mg={...mg,run:0,busy:0,pos:d.pos,hit:d.i};$('mgs').innerHTML='<span class="er">💥 Мина! Ставка потеряна</span>';try{navigator.vibrate&&navigator.vibrate([80,40,80])}catch(e){}}
 else if(d.done){S.bal+=d.win;updBal();mg={...mg,run:0,busy:0,opened:d.opened,pos:d.pos,mult:d.mult};$('mgs').innerHTML=`<span class="ok">Все клетки открыты! +${d.win} ⭐</span>`}

 document.body.appendChild(o);

 tr.style.transition='none';tr.style.transform='translateX(0)';tr.getBoundingClientRect();
 tr.style.transition='transform 5s cubic-bezier(.1,.75,.15,1)';tr.style.transform=`translateX(${-x}px)`;

let wrot=0,wbusy=0,woff=0;
function wheelSvg(P){const n=P.length,a=360/n,s=P.reduce((x,p)=>x+p.w,0)||1,z=n>8?46:62;
 let h='<svg viewBox="0 0 400 400" width="100%" height="100%"><circle cx="200" cy="200" r="194" fill="#0d1119" stroke="#1d2535" stroke-width="12"/>';
 for(let i=0;i<n;i++){const t=(i+.5)*a*Math.PI/180;h+=`<line x1="200" y1="200" x2="${(200+188*Math.sin(t)).toFixed(1)}" y2="${(200-188*Math.cos(t)).toFixed(1)}" stroke="#1d2535" stroke-width="1.5"/>`}
 P.forEach((p,i)=>{h+=`<g transform="rotate(${(i*a).toFixed(3)} 200 200)">`+(p.img?`<image href="/api/img/${esc(p.img)}" x="${200-z/2}" y="52" width="${z}" height="${z}" preserveAspectRatio="xMidYMid meet"/>`:`<text x="200" y="${52+z*.75}" text-anchor="middle" font-size="${z*.6}">${p.value>0?'🎁':'💨'}</text>`)+`<text x="200" y="${52+z+26}" text-anchor="middle" fill="#3b9bff" font-weight="700" font-size="17">${+(p.w/s*100).toFixed(1)}%</text></g>`});
 return h+'</svg>'}
const wNow=()=>Date.now()+woff;
const wLeft=()=>Math.max(0,(S.wheel.next||0)-wNow());
const wFree=()=>S.wheel.free&&wLeft()<=0;
const fmtT=ms=>{const t=Math.ceil(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':')};
function wheelView(){if(!S.cfg.on.wheel)return off();const W=S.wheel;
 const cd=W.cd==24?'в сутки':`раз в ${W.cd} ч`;
 if(W.prizes.length<2)return `<h1>Колесо удачи</h1><div class="card mu">Колесо пока не настроено</div>`;
 return `<h1>Колесо удачи</h1><p class="sub">${W.free?`Одна бесплатная прокрутка ${cd}`:'Крутите колесо и забирайте призы'}</p>
 <div class="wheel"><div class="wptr"></div><div id="wh" style="transform:rotate(${wrot}deg)">${wheelSvg(W.prizes)}</div><div class="hub">${esc(S.cfg.site.split(' ')[0].toUpperCase())}</div></div>
 <button class="big" id="wb" onclick="wSpin()">Крутить</button><div class="mu" id="wt" style="text-align:center;margin-top:12px"></div><div id="ws" style="text-align:center;margin-top:6px"></div>`}
function updWheelBtn(){const b=$('wb');if(!b||!S)return;const W=S.wheel,f=wFree(),t=$('wt');
 if(f)b.textContent='Крутить бесплатно';else if(W.price>0)b.textContent=`Крутить за ${W.price} ⭐`;else b.textContent='Недоступно';
 b.disabled=wbusy||(!f&&!(W.price>0));
 if(t)t.textContent=!f&&W.free?`Бесплатная прокрутка через ${fmtT(wLeft())}`:''}
setInterval(()=>{if(S&&tab=='wheel'&&!wbusy)updWheelBtn()},1000);
async function wSpin(){if(wbusy||!S)return;const W=S.wheel,free=wFree();wbusy=1;updWheelBtn();$('ws').textContent='';
 try{const d=await api('wheel/spin',{free});
  if(!free){S.bal-=W.price;updBal()}else W.next=d.next;
  const a=360/W.prizes.length,el=$('wh');
  wrot=(Math.ceil(wrot/360)+6)*360-d.idx*a+(Math.random()-.5)*a*.6;
  el.style.transition='transform 5s cubic-bezier(.12,.7,.1,1)';el.style.transform=`rotate(${wrot}deg)`;
  setTimeout(()=>{const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML=`<div id="rv">${resH(d.item)}</div>`;document.body.appendChild(o);try{navigator.vibrate&&navigator.vibrate(d.item.value>0?[40,40,80]:30)}catch(e){}},5300)
 }catch(e){wbusy=0;const s=$('ws');if(s)s.innerHTML=er(e);updWheelBtn()}}

function pickAvatar(){const f=document.createElement('input');f.type='file';f.accept='image/*';
 f.onchange=()=>{const file=f.files[0];if(!file)return;const url=URL.createObjectURL(file),im=new Image();
  im.onload=async()=>{try{const sz=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(im,(im.width-sz)/2,(im.height-sz)/2,sz,sz,0,0,256,256);
   let data=c.toDataURL('image/webp',.85);if(!data.startsWith('data:image/webp'))data=c.toDataURL('image/jpeg',.85);
   await api('avatar/set',{data});msg='<span class="ok">Фото профиля обновлено</span>';await load()}catch(e){msg=er(e);render()}URL.revokeObjectURL(url)};
  im.onerror=()=>{msg=er(new Error('Не удалось прочитать картинку'));render()};im.src=url};
 f.click()}

function pickImg(kind,ci,ii){const f=document.createElement('input');f.type='file';f.accept='image/*';
 f.onchange=()=>{const file=f.files[0];if(!file)return;const url=URL.createObjectURL(file),im=new Image();
  im.onload=async()=>{try{const k=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);
   let data=c.toDataURL('image/webp',.85);if(!data.startsWith('data:image/webp'))data=c.toDataURL('image/png');
   const d=await api('admin/upload',{data});
   if(kind=='c')EC[ci].img=d.id;else if(kind=='i')EC[ci].items[ii].img=d.id;else if(kind=='b')EB[ci].img=d.id;else EW.items[ii].img=d.id;
   msg='<span class="ok">Фото загружено. Не забудьте нажать «Сохранить»</span>';render()}catch(e){msg=er(e);render()}URL.revokeObjectURL(url)};
  im.onerror=()=>{msg=er(new Error('Не удалось прочитать картинку'));render()};im.src=url};
 f.click()}

function adj(o,ii,v){const it=o.items,s=sm(o),P=it.map(x=>x.w/s*100);v=it.length==1?100:Math.min(100,Math.max(0,v||0));const so=P.reduce((a,b,k)=>k==ii?a:a+b,0);
 it.forEach((x,k)=>{x.w=k==ii?v:+(so>0?P[k]*(100-v)/so:(100-v)/(it.length-1)).toFixed(2)});render()}
const setPct=(ci,ii,v)=>adj(EC[ci],ii,v),setWPct=(ii,v)=>adj(EW,ii,v);

function resizeImg(file,max,q){return new Promise((ok,no)=>{const url=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);let d=c.toDataURL('image/webp',q);if(!d.startsWith('data:image/webp'))d=c.toDataURL('image/jpeg',q);URL.revokeObjectURL(url);ok(d)};

 ${c.items.map((i,ii)=>`<div class="it">${thumb(i.img,'i',ci,ii)}<input value="${esc(i.name)}" onchange="EC[${ci}].items[${ii}].name=this.value"><input class="sm" type="number" value="${i.value}" onchange="EC[${ci}].items[${ii}].value=+this.value"><input class="sm" type="number" step="0.01" value="${pc(c,i)}" onchange="setPct(${ci},${ii},+this.value)"><button class="g sm" style="width:40px;padding:8px 0" onclick="delItem(${ci},${ii})">✕</button></div>`).join('')}
 <div class="row" style="margin-top:8px"><button class="g" onclick="addItem(${ci})">+ приз</button><button onclick="saveCase(${ci})">Сохранить</button><button class="r" onclick="delCase(${ci})">Удалить</button></div></div>`).join('');
 h+=`<button style="width:100%" onclick="EC.push({id:0,name:'Новый кейс',price:10,img:'',items:[{name:'Приз',value:10,w:100,img:''}]});render()">+ Новый кейс</button>`;
h+=`<h3 style="margin-top:18px">🏅 Бейджи</h3><div class="card"><div class="mu">Фото (или смайлик) · название · цвет. Бейдж создаётся здесь, потом выдаётся игроку по юзернейму. Одному игроку можно выдать несколько бейджей.</div>`
 +EB.map((b,i)=>`<div style="border-top:1px solid var(--bd);margin-top:8px;padding-top:8px"><div class="it">${thumb(b.img,'b',i,0)}<input style="width:54px;flex:none;text-align:center" maxlength="8" placeholder="🏅" value="${esc(b.icon)}" onchange="EB[${i}].icon=this.value"><input value="${esc(b.name)}" maxlength="24" onchange="EB[${i}].name=this.value"><input class="clr" type="color" value="${esc(b.color)}" onchange="EB[${i}].color=this.value;render()"></div><div class="bdgs">${bdg(b)}</div><div class="row"><button onclick="saveBadge(${i})">Сохранить</button><button class="r" onclick="delBadge(${i})">Удалить</button></div></div>`).join('')
 +`<button class="g" style="width:100%;margin-top:10px" onclick="addBadge()">+ Новый бейдж</button></div>`
 +(EB.some(b=>b.id)?`<div class="card"><b>Выдать или забрать бейдж</b><input placeholder="@username игрока" value="${esc(BGU)}" oninput="BGU=this.value" autocapitalize="none"><select onchange="BGB=this.value">${EB.filter(b=>b.id).map(b=>`<option value="${b.id}" ${b.id==BGB?'selected':''}>${esc((b.icon||'')+' '+b.name)}</option>`).join('')}</select><div class="row" style="margin-top:6px"><button onclick="giveBadge(0)">Выдать</button><button class="g" onclick="giveBadge(1)">Забрать</button></div></div>`:'')
;
  if(S.owner)h+=logCard();
  const c=A.cfg;
 h+=`<div class="card" style="margin-top:14px"><b>Настройки</b>${FLD.map(([k,l,t])=>`<div class="mu" style="margin-top:6px">${l}</div><input id="cf_${k}" ${t?'':'type="number"'} value="${esc(c[k])}">`).join('')}<button style="margin-top:8px" onclick="saveCfg()">Сохранить</button></div>`;
 h+=`<div class="card"><b>Коды верификации (${(A.vr||[]).length})</b><div class="mu">Отправьте код человеку в Unixgram со своего аккаунта на указанный юзернейм и нажмите ✓.</div>${(A.vr||[]).map(v=>`<div class="it"><span style="flex:1">@${esc(v.username)}: <b>${esc(v.code)}</b></span><button class="sm" onclick="vSent('${esc(v.username)}')">✓</button></div>`).join('')||'<div class="mu">Нет новых</div>'}<button class="g" onclick="loadAdmin()">Обновить</button></div>`;
 h+=`<div class="card"><b>Заявки (${A.reqs.length})</b>${A.reqs.map(r=>`<div class="it"><span style="flex:1">@${esc(r.user)}: ${rd2(r)}</span><button class="sm" onclick="reqAct(${r.id},1)">✓</button><button class="r sm" onclick="reqAct(${r.id},0)">✕</button></div>`).join('')||'<div class="mu">Нет новых</div>'}</div>`;
 if(S.owner)h+=`<div class="card"><b>Бот Unixgram (${S.cfg.botOn?'подключён':'не подключён'})</b><div class="mu">Работает без вебхука: сайт сам опрашивает бота. Вставьте токен и нажмите «Подключить».</div><input id="bt2" type="password" placeholder="Токен бота"><div class="row"><button onclick="act('admin/bot',{token:$('bt2').value},d=>'Бот подключён'+(d.name?': @'+d.name:''))">Подключить</button>${S.cfg.botOn?`<button class="g" onclick="act('admin/bot/off',{},()=>'Бот отключён')">Отключить</button>`:''}</div>${A.cfg.bot_err?`<div class="er">Ошибка бота: ${esc(A.cfg.bot_err)}</div>`:''}${A.cfg.last_upd?`<div class="mu">Последнее событие: ${esc(A.cfg.last_upd)}</div>`:''}</div><div class="card"><b>Админы (только владелец)</b>${A.admins.map(n=>`<div class="it"><span style="flex:1">@${esc(n)}</span><button class="r sm" onclick="act('admin/admins',{name:'${esc(n)}',remove:1})">✕</button></div>`).join('')}<div class="it"><input id="na" placeholder="@username"><button class="sm" onclick="act('admin/admins',{name:$('na').value})">+</button></div><input id="np" type="password" placeholder="Новый пароль (от 8 символов)"><button class="g" onclick="act('admin/password',{password:$('np').value},()=>'Пароль изменён')">Сменить пароль</button></div>`;
 return h}
const rd2=r=>rd({...r})+(r.type=='dep'&&r.from_user!=r.user?`<br><span class="er">⚠️ перевод с @${esc(r.from_user)}, а аккаунт @${esc(r.user)}: проверьте</span>`:'');
function vSent(u){act('admin/vsent',{u},()=>'Отмечено')}
function reqAct(id,ok){act('admin/req',{id,ok},()=>ok?'Заявка подтверждена':'Заявка отклонена')}
async function admLogin(){try{await api('admin/login',{password:$('ap').value});msg='';await load();await loadAdmin()}catch(e){msg=er(e);render()}}
if(tk)load();else render();
</script></body></html>
